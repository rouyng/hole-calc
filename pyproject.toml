[project]
name = "hole-calc"
version = "0.1.0"
description = "Calculate bore diameter from three-pin gage measurements"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1",
    "flask-wtf>=1.3",
    "wtforms>=3.3",
    "django-htmlmin>=0.11",
    "gunicorn>=27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-flask>=1.3",
    "flake8>=7.5",
]

[tool.uv]
package = false
